AWSTemplateFormatVersion: "2010-09-09"
Description: Nova Syndicate - AWS Backup Stack for EC2 and RDS

Parameters:
  EnvironmentName:
    Type: String
    Default: prod

  BackupVaultName:
    Type: String
    Default: NovaSyndicate-Backup-Vault

  BackupPlanName:
    Type: String
    Default: NovaSyndicate-Daily-Backup-Plan

Resources:
  BackupVault:
    Type: AWS::Backup::BackupVault
    Properties:
      BackupVaultName: !Ref BackupVaultName
      EncryptionKeyArn: !ImportValue NovaSyndicate-KMSKeyArn

  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: !Ref BackupPlanName
        BackupPlanRule:
          - RuleName: DailyBackups
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: cron(0 2 * * ? *)
            StartWindowMinutes: 60
            CompletionWindowMinutes: 180
            Lifecycle:
              DeleteAfterDays: 30
            RecoveryPointTags:
              Project: NovaSyndicate
              Environment: !Ref EnvironmentName

  BackupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: NovaSyndicate-AWSBackup-Role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: backup.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores

  BackupSelection:
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref BackupPlan
      BackupSelection:
        SelectionName: NovaSyndicate-Tagged-Resources
        IamRoleArn: !GetAtt BackupRole.Arn
        ListOfTags:
          - ConditionType: STRINGEQUALS
            ConditionKey: Backup
            ConditionValue: "true"

Outputs:
  BackupVaultName:
    Description: Backup Vault Name
    Value: !Ref BackupVault

  BackupPlanId:
    Description: Backup Plan ID
    Value: !Ref BackupPlan

  BackupRoleArn:
    Description: AWS Backup IAM Role ARN
    Value: !GetAtt BackupRole.Arn